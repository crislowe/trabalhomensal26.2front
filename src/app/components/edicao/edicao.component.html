<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">

    <div class="card shadow-2">
      <div class="card-header bg-primary text-white py-3">
        <h5 class="mb-0 fw-bold">
          <i class="fas" [ngClass]="isEdicao ? 'fa-edit' : 'fa-plus-circle'"></i>
          {{ isEdicao ? 'Editar Produto' : 'Cadastrar Novo Produto' }}
        </h5>
      </div>

      <div class="card-body p-4">
        
        <form (ngSubmit)="salvar()" #meuForm="ngForm">

          <div class="mb-3">
            <label class="form-label fw-bold">Nome do Produto</label>
            <input 
              type="text" 
              class="form-control" 
              name="nome" 
              [(ngModel)]="produto.nome" 
              placeholder="Ex: Café Expresso"
              required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Preço (R$)</label>
            <input 
              type="number" 
              step="0.50" 
              class="form-control" 
              name="preco" 
              [(ngModel)]="produto.preco" 
              placeholder="Ex: 6.50"
              required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Quantidade em Estoque</label>
            <input 
              type="number" 
              class="form-control" 
              name="quantidadeEstoque" 
              [(ngModel)]="produto.quantidadeEstoque" 
              placeholder="Ex: 20"
              required>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a routerLink="/painel/lista" class="btn btn-secondary me-2">
              Cancelar
            </a>
            <button type="submit" class="btn btn-success" [disabled]="!meuForm.valid">
              <i class="fas fa-save me-1"></i>Salvar Produto
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>
