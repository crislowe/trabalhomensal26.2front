<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="card shadow-3">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">
            <i class="fas fa-coffee me-2"></i>
            {{ modoCadastro ? 'Criar Nova Conta' : 'Cafeteria - Login' }}
          </h4>
        </div>
        
        <div class="card-body p-4">
          
          <div *ngIf="mensagemErro" class="alert alert-danger mb-3 py-2">
            {{ mensagemErro }}
          </div>

          <div *ngIf="mensagemSucesso" class="alert alert-success mb-3 py-2">
            {{ mensagemSucesso }}
          </div>

          <form (ngSubmit)="modoCadastro ? cadastrar() : entrar()">
            
            <div class="mb-3">
              <label class="form-label">Usuário</label>
              <input 
                type="text" 
                class="form-control" 
                name="usuario" 
                [(ngModel)]="usuario" 
                placeholder="Digite seu usuário"
                required>
            </div>

            <div class="mb-4">
              <label class="form-label">Senha</label>
              <input 
                type="password" 
                class="form-control" 
                name="senha" 
                [(ngModel)]="senha" 
                placeholder="Digite sua senha"
                required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
              {{ modoCadastro ? 'Cadastrar Conta' : 'Entrar' }}
            </button>

            <div class="text-center">
              <button type="button" class="btn btn-link text-decoration-none" (click)="alternarModo()">
                {{ modoCadastro ? 'Já possui uma conta? Faça Login' : 'Não tem conta? Cadastre-se aqui' }}
              </button>
            </div>
            
          </form>

        </div>
        
        <div class="card-footer text-muted text-center py-2">
          <small>Sistema de Controle de Estoque da Cafeteria</small>
        </div>
      </div>

    </div>
  </div>
</div>
