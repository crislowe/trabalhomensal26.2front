<br>
<div class="container">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">

          <div class="row">
            <div class="col-6">
              <h3><i class="fas fa-mug-hot fa-sm"></i> Produtos</h3>
            </div>
            <div class="col-6 alinharADireita">
              <a (click)="new()" class="btn btn-success btn-rounded" mdbRipple>
                <i class="fas fa-plus fa-sm"></i> Novo
              </a>
            </div>
          </div>
          <br>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Qtde</th>
                <th>Categoria</th>
                <th>Fornecedor</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              @for (produto of lista; track $index) {
              <tr>
                <td>{{produto.id}}</td>
                <td>{{produto.nome}}</td>
                <td>R$ {{produto.preco}}</td>
                <td>{{produto.quantidade}}</td>
                <td>{{produto.categoria}}</td>
                <td>{{produto.nomeFornecedor}}</td>
                <td class="alinharADireita">
                  <a (click)="edit(produto)" class="btn btn-primary btn-rounded" mdbRipple>
                    <i class="fas fa-pencil fa-sm"></i>
                  </a>
                  <button (click)="delete(produto)" class="btn btn-danger btn-rounded" mdbRipple>
                    <i class="fas fa-trash fa-sm"></i>
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>

        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #modalProdutoForm>
  <div class="modal-header">
    @if (produtoEdit.id > 0) {
      <h5 class="modal-title">Editar produto</h5>
    } @else {
      <h5 class="modal-title">Novo produto</h5>
    }
    <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
  </div>
  <div class="modal-body">
    <app-produtos-form [produto]="produtoEdit" (meuEvento)="meuEventoTratamento($event)"></app-produtos-form>
  </div>
</ng-template>
