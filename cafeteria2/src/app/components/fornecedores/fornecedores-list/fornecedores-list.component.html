<br>
<div class="container">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">

          <div class="row">
            <div class="col-6">
              <h3><i class="fas fa-truck fa-sm"></i> Fornecedores</h3>
            </div>
            <div class="col-6 alinharADireita">
              <a (click)="new()" class="btn btn-success btn-rounded" mdbRipple>
                <i class="fas fa-plus fa-sm"></i> Novo
              </a>
            </div>
          </div>
          <br>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CNPJ</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              @for (fornecedor of lista; track $index) {
              <tr>
                <td>{{fornecedor.id}}</td>
                <td>{{fornecedor.nome}}</td>
                <td>{{fornecedor.cnpj}}</td>
                <td class="alinharADireita">
                  <a (click)="edit(fornecedor)" class="btn btn-primary btn-rounded" mdbRipple>
                    <i class="fas fa-pencil fa-sm"></i>
                  </a>
                  <button (click)="delete(fornecedor)" class="btn btn-danger btn-rounded" mdbRipple>
                    <i class="fas fa-trash fa-sm"></i>
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>

        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #modalFornecedorForm>
  <div class="modal-header">
    @if (fornecedorEdit.id > 0) {
      <h5 class="modal-title">Editar fornecedor</h5>
    } @else {
      <h5 class="modal-title">Novo fornecedor</h5>
    }
    <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
  </div>
  <div class="modal-body">
    <app-fornecedores-form [fornecedor]="fornecedorEdit" (meuEvento)="meuEventoTratamento($event)"></app-fornecedores-form>
  </div>
</ng-template>
